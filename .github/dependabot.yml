version: 2
updates:
  # Routine updates target the default branch. Security updates are enabled separately.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    allow:
      - dependency-type: direct
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      npm-patches:
        patterns: ["*"]
        update-types: [patch]
      react-types:
        patterns: ["@types/react", "@types/react-dom"]
        update-types: [minor]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    allow:
      - dependency-type: direct
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      python-patches:
        patterns: ["*"]
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
