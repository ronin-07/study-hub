name: Study Hub checks

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Report Python runtime
        run: python --version
      - name: Scan tracked files for accidentally committed credentials
        run: python scripts/check_credentials.py
      - name: Install locked API dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Install locked development dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        working-directory: backend
        env:
          STUDY_HUB_AUTH_MODE: local
          STORAGE_BACKEND: sqlite
        run: python -m pytest -q
      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q app
      - name: Audit installed Python dependencies
        working-directory: backend
        run: |
          python -m pip check
          python -m pip_audit

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Report frontend runtime
        run: |
          node --version
          npm --version
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        working-directory: web
        run: npm run lint
      - name: Frontend unit tests
        working-directory: web
        run: npm test
      - name: Production build without account credentials
        working-directory: web
        env:
          NEXT_PUBLIC_STUDY_HUB_AUTH_MODE: local
          NEXT_PUBLIC_API_URL: /
        run: npm run build
      - name: Audit npm dependencies (high and critical gate)
        working-directory: web
        run: npm audit --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks and verify release checksum
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cd "$tmp"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "$base/$archive"
          curl --fail --silent --show-error --location --retry 3 --output "$sums" "$base/$sums"
          grep -F "$archive" "$sums" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan reachable Git history
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="--all --full-history -m" --redact=100 .'
      - name: Scan tracked source snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(mktemp -d)
          trap 'rm -rf "$snapshot"' EXIT
          git archive HEAD | tar -x -C "$snapshot"
          "$RUNNER_TEMP/gitleaks" dir --redact=100 "$snapshot"
